# Daily Ops — Mac, powered by the Claude API (voice stays local)
# Install with: jarvis init --preset daily-ops-mac --force
# Then run:     scripts/daily_ops_setup.sh   (schedules the recurring tasks)
#
# One config for five jobs:
#   1. Morning briefing  — `jarvis digest`        (Gmail, Calendar, Tasks, news)
#   2. Scheduled monitor — `jarvis scheduler ...` (operative agent with memory)
#   3. Deep research     — GUI Deep Research / `jarvis ask --agent deep_research`
#   4. Code assistant    — `jarvis ask --agent orchestrator "..."`
#   5. Voice assistant   — `jarvis listen` (say "Hey Jarvis" or clap twice, then
#                          talk; follow-ups need no new wake-up)
#
# Requirements:
#   - ANTHROPIC_API_KEY exported in your shell (https://console.anthropic.com)
#   - `jarvis connect gdrive` (one OAuth covers Gmail / Calendar / Tasks)
#   - Optional: Ollama only for local embeddings / memory search

[engine]
default = "cloud"

[intelligence]
# Claude Haiku 5.5 everywhere: fastest and cheapest ($0.10 / $0.50 per 1M
# tokens). Swap any line for "claude-sonnet-5-5" or "claude-opus-5-5" when
# a job needs more depth. No temperature: current Claude models reject it.
default_model = "claude-haiku-5-5"
model_short = "claude-haiku-5-5"
model_code = "claude-haiku-5-5"
max_tokens = 4096

[deep_research]
engine = "cloud"
model = "claude-haiku-5-5"

[agent]
default_agent = "orchestrator"     # Multi-turn with automatic tool selection
max_turns = 12
context_from_memory = true

[tools]
enabled = [
  # briefing
  "digest_collect", "text_to_speech",
  # research + memory
  "knowledge_search", "knowledge_sql", "scan_chunks",
  "memory_store", "memory_search", "think", "web_search",
  # voice commands: open apps/links, volume, music, dark mode (fixed safe list)
  "mac_control",
  # code
  "code_interpreter", "file_read", "file_write", "shell_exec", "calculator",
]

[tools.storage]
default_backend = "sqlite"

# ─── Voice: Jarvis in Brazilian Portuguese, 100% local ──────
# `jarvis listen` — say "Hey Jarvis" (or clap twice), then talk.
# Needs: uv sync --extra speech --extra voice  +  brew install espeak-ng

[speech]
backend = "faster-whisper"         # Local speech-to-text
model = "base"                     # "small" = more accurate, slower
language = "pt"                    # Português; "" = auto-detect, "en" = English
compute_type = "int8"              # Apple Silicon CPU-friendly
tts_backend = "kokoro"
voice_id = "pm_alex"               # PT-BR male; "bm_george" = British butler (en)
voice_speed = 1.05

# Hands-free: the offline "Hey Jarvis" wake word and/or a double clap.
wake = "both"                      # "jarvis", "clap" or "both"
wake_threshold = 0.5               # lower = more sensitive (more false wakes)
follow_up_seconds = 8              # keep listening this long after an answer

# ─── Morning Digest ─────────────────────────────────────────

[digest]
enabled = true
schedule = "0 7 * * 1-5"           # 7 AM, weekdays
timezone = "America/Sao_Paulo"
persona = "jarvis-ptbr"               # Portuguese; "jarvis" = English
honorific = "Julio"
tts_backend = "kokoro"             # Local TTS, no API key ("cartesia" for premium)
voice_id = "pm_alex"               # PT-BR male
voice_speed = 1.15

sections = ["messages", "calendar", "world"]

[digest.messages]
sources = ["gmail", "google_tasks"]
# Add any of: "slack", "notion", "github_notifications", "imessage"

[digest.calendar]
sources = ["gcalendar"]

[digest.world]
sources = ["hackernews", "news_rss"]
